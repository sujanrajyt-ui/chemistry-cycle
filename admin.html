<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chemistry Cycle – Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css" />

<!-- Vercel Web Analytics -->
<script>
  window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
</script>
<script defer src="/_vercel/insights/script.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
.manage-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 1rem;
  border-bottom: 1px solid var(--glass-border);
  background: white;
}
.manage-row:last-child { border-bottom: none; }
.manage-name { font-weight: 600; color: var(--text-primary); cursor: pointer; text-decoration: none; }
.manage-name:hover { text-decoration: underline; color: var(--primary); }
.action-btn { 
  background: #f87171; color: white; border: none; padding: 0.4rem 0.8rem; 
  border-radius: 6px; cursor: pointer; font-weight: 600; font-size: 0.85rem;
}
.action-btn:hover { background: #ef4444; }
.btn-small { padding: 0.5rem 1rem; margin-top: 0; width: auto; }
</style>
</head>

<body>

<header class="site-header">
  <div class="header-inner">
    <div class="logo">Chemistry Admin Panel</div>
  </div>
</header>

<main class="container">

<!-- UPLOAD -->
<div class="admin-card">
  <h2>Upload New File to GitHub</h2>
  <p style="font-size:0.85rem; color:#64748b; margin-top:-10px; margin-bottom:1.5rem;">Max file size: 4.5MB</p>

  <form id="uploadForm">
    <label>Subject</label>
    <select id="subject">
      <option value="IPP">IPP</option>
      <option value="EEE">EEE</option>
      <option value="MAT">MAT</option>
      <option value="CHY">CHY</option>
      <option value="EV">EV</option>
      <option value="ESS">ESS</option>
      <option value="BIO">BIO</option>
      <option value="ADLD">ADLD</option>
      <option value="BE">BE</option>
    </select>

    <label>Document Type</label>
    <select id="option">
      <option value="Chapter_1">Chapter 1</option>
      <option value="Chapter_2">Chapter 2</option>
      <option value="Chapter_3">Chapter 3</option>
      <option value="Chapter_4">Chapter 4</option>
      <option value="Chapter_5">Chapter 5</option>
      <option value="MCQ">MCQ</option>
      <option value="Question_Bank">Question Bank</option>
      <option value="Notes">Notes</option>
    </select>

    <label>File</label>
    <input id="file" type="file" accept="application/pdf" required>

    <button type="submit" class="admin-btn">Commit to GitHub</button>
  </form>

  <div id="uploadStatus" class="status-msg" style="display:none;"></div>
</div>

<!-- MANAGE FILES -->
<div class="admin-card">
  <h2>Manage Files</h2>
  
  <div style="display:flex; gap:1rem; align-items:flex-end; margin-bottom: 1.5rem;">
    <div style="flex:1;">
      <label>Select Subject</label>
      <select id="manageSubject" style="margin-bottom:0;">
        <option value="IPP">IPP</option>
        <option value="EEE">EEE</option>
        <option value="MAT">MAT</option>
        <option value="CHY">CHY</option>
        <option value="EV">EV</option>
        <option value="ESS">ESS</option>
        <option value="BIO">BIO</option>
        <option value="ADLD">ADLD</option>
        <option value="BE">BE</option>
      </select>
    </div>
    <button id="loadBtn" class="admin-btn btn-small" style="background:var(--primary-hover);">Load Notes</button>
  </div>

  <div id="manageFilesBox" style="border: 1px solid #cbd5e1; border-radius: 8px; overflow: hidden;">
    <div style="padding: 1rem; color: #64748b; font-size: 0.9rem; text-align: center;">Click "Load Notes" to manage files.</div>
  </div>
</div>

<!-- QUIZ SCORES -->
<div class="admin-card" style="margin-top: 2rem;">
  <h2>Quiz Submissions</h2>
  
  <div style="display:flex; gap:1rem; align-items:flex-end; margin-bottom: 1.5rem;">
    <button id="loadScoresBtn" class="admin-btn btn-small" style="background:var(--primary-hover);">Load Encrypted Scores</button>
  </div>

  <div id="scoresBox" style="border: 1px solid #cbd5e1; border-radius: 8px; overflow: hidden; overflow-x: auto;">
    <div style="padding: 1rem; color: #64748b; font-size: 0.9rem; text-align: center;">Click "Load Encrypted Scores" to decrypt and view records.</div>
  </div>

  <div id="attemptCounts" style="margin-top: 1.5rem; display: none; gap: 1rem; flex-wrap: wrap;">
    <div style="background: #f1f5f9; padding: 1rem; border-radius: 8px; flex: 1; min-width: 150px; text-align: center; border: 1px solid #e2e8f0;">
      <div style="font-size: 0.8rem; font-weight: 600; color: #64748b; text-transform: uppercase;">Bio Attempts</div>
      <div id="bioCount" style="font-size: 1.8rem; font-weight: 800; color: var(--primary);">0</div>
    </div>
    <div style="background: #f1f5f9; padding: 1rem; border-radius: 8px; flex: 1; min-width: 150px; text-align: center; border: 1px solid #e2e8f0;">
      <div style="font-size: 0.8rem; font-weight: 600; color: #64748b; text-transform: uppercase;">ESS Attempts</div>
      <div id="essCount" style="font-size: 1.8rem; font-weight: 800; color: #10b981;">0</div>
    </div>
  </div>
</div>

</main>

<script type="module">
/* ===== GITHUB AUTH SETUP ===== */
let ghToken = null;

// Silently grab the token securely from Vercel in the background as soon as Admin page opens
async function fetchTokenSilently() {
  try {
    const res = await fetch('/api/token?pass=sujanraj');
    if (res.ok) {
      const data = await res.json();
      ghToken = data.token;
    }
  } catch (e) {
    console.warn("Failed to securely pull token from backend");
  }
}
fetchTokenSilently();

/* ===== FILE TO BASE64 HELPER ===== */
const toBase64 = file => new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.readAsDataURL(file);
    reader.onload = () => resolve(reader.result.split(',')[1]); // remove data:image... prefix
    reader.onerror = error => reject(error);
});

/* ===== UPLOAD ===== */
const uploadForm = document.getElementById('uploadForm');
const uploadStatus = document.getElementById('uploadStatus');

function setStatus(msg, type) {
  uploadStatus.style.display = 'block';
  uploadStatus.textContent = msg;
  uploadStatus.className = 'status-msg ' + type;
}

uploadForm.addEventListener('submit', async (e) => {
  e.preventDefault();

  if(!ghToken) { alert("GitHub Token Required!"); return; }

  const subject = document.getElementById('subject').value;
  const option = document.getElementById('option').value;
  const file = document.getElementById('file').files[0];

  if (!subject || !file) {
    setStatus("Subject and File are required.", "error"); return;
  }
  
  if (file.size > 99 * 1024 * 1024) {
    setStatus("GitHub limit is 100MB per file.", "error"); return;
  }

  const finalFilename = `${subject}_${option}.pdf`;

  setStatus("Uploading file direct to GitHub (bypassing Vercel limits)...", "");

  try {
    const base64Content = await toBase64(file);

    const payload = {
      message: `CMS Upload: ${finalFilename} to ${subject}`,
      content: base64Content,
      branch: 'main'
    };

    const uploadRes = await fetch(`https://api.github.com/repos/sujanrajyt-ui/chemistry-cycle/contents/notes/${subject}/${finalFilename}`, {
      method: 'PUT',
      headers: {
        'Authorization': `Bearer ${ghToken}`,
        'Accept': 'application/vnd.github.v3+json',
        'Content-Type': 'application/json'
      },
      body: JSON.stringify(payload)
    });

    if (!uploadRes.ok) {
      const errData = await uploadRes.json();
      if(errData.message === "Bad credentials") {
         localStorage.removeItem('GH_TOKEN'); // clear bad token
         throw new Error("Invalid GitHub Token! The token does not have 'repo' permissions or is typed wrong. Refresh the page to type it again.");
      }
      throw new Error(errData.message || "Upload Failed");
    }

    setStatus(`Committed successfully to GitHub in notes/${subject}!`, "success");
    uploadForm.reset();

    if (document.getElementById('manageSubject').value === subject) {
      document.getElementById('loadBtn').click();
    }

  } catch(err) {
    setStatus(err.message, "error");
    console.error(err);
  }
});


/* ===== MANAGE FILES ===== */
const loadBtn = document.getElementById('loadBtn');
const manageFilesBox = document.getElementById('manageFilesBox');

loadBtn.addEventListener('click', async () => {
  const subject = document.getElementById('manageSubject').value;
  manageFilesBox.innerHTML = `<div style="padding:1rem;text-align:center;"><div class="loader" style="margin:0;"></div></div>`;

  try {
    const res = await fetch(`/api/list?subject=${subject}`);
    if (!res.ok) throw new Error(`Backend fetch failed (Status ${res.status})`);
    
    const files = await res.json();

    if (!files || files.length === 0) {
      manageFilesBox.innerHTML = `<div style="padding: 1rem; color: #64748b; text-align: center;">No files uploaded for ${subject} yet.</div>`;
      return;
    }

    manageFilesBox.innerHTML = '';
    files.forEach(file => {
      const row = document.createElement('div');
      row.className = 'manage-row';
      
      const a = document.createElement('a');
      a.href = file.url;
      a.target = "_blank";
      a.className = "manage-name";
      a.textContent = file.name.replace(/_/g, ' ');

      const delBtn = document.createElement('button');
      delBtn.className = "action-btn";
      delBtn.textContent = "Delete";
      delBtn.onclick = async () => {
        if(!confirm(`Are you sure you want to permanently delete "${file.name}" from GitHub?`)) return;
        
        delBtn.textContent = "Deleting...";
        delBtn.disabled = true;

        try {
          const payload = {
            message: `CMS Delete: Remove ${file.path}`,
            sha: file.sha,
            branch: 'main'
          };

          const delRes = await fetch(`https://api.github.com/repos/sujanrajyt-ui/chemistry-cycle/contents/${file.path}`, {
            method: 'DELETE',
            headers: {
              'Authorization': `Bearer ${ghToken}`,
              'Accept': 'application/vnd.github.v3+json',
              'Content-Type': 'application/json'
            },
            body: JSON.stringify(payload)
          });
          
          if(!delRes.ok) {
            const err = await delRes.json();
            throw new Error(err.message || "Delete failed");
          }
          
          row.remove();
          if (manageFilesBox.children.length === 0) {
            manageFilesBox.innerHTML = `<div style="padding: 1rem; color: #64748b; text-align: center;">No files in ${subject}.</div>`;
          }
        } catch(e) {
          alert(e.message);
          delBtn.textContent = "Delete";
          delBtn.disabled = false;
        }
      };

      row.appendChild(a);
      row.appendChild(delBtn);
      manageFilesBox.appendChild(row);
    });

  } catch(e) {
    manageFilesBox.innerHTML = `<div style="padding: 1rem; color: #ef4444; font-weight: 600; text-align: center;">Error loading files: ${e.message}</div>`;
  }
});

/* ===== LOAD SCORES ===== */
const loadScoresBtn = document.getElementById('loadScoresBtn');
const scoresBox = document.getElementById('scoresBox');

loadScoresBtn.addEventListener('click', async () => {
  scoresBox.innerHTML = `<div style="padding:1rem;text-align:center;"><div class="loader" style="margin:0;"></div></div>`;
  try {
    const res = await fetch('/api/getScores?pass=sujanraj');
    if (!res.ok) throw new Error(`Decryption/Fetch failed (Status ${res.status})`);
    
    const scores = await res.json();
    if (!scores || scores.length === 0) {
      scoresBox.innerHTML = `<div style="padding: 1rem; color: #64748b; text-align: center;">No scores recorded yet.</div>`;
      return;
    }

    // Calculate counts
    const bioCount = scores.filter(s => s.subject.includes('Biology')).length;
    const essCount = scores.filter(s => s.subject.includes('Environmental')).length;
    
    document.getElementById('bioCount').textContent = bioCount;
    document.getElementById('essCount').textContent = essCount;
    document.getElementById('attemptCounts').style.display = 'flex';

    let tableHTML = `<table style="width:100%; border-collapse:collapse; text-align:left;">
      <thead>
        <tr style="background:#f8fafc; border-bottom:1px solid #e2e8f0;">
          <th style="padding:12px 16px; font-weight:600; color:#475569;">Date</th>
          <th style="padding:12px 16px; font-weight:600; color:#475569;">Name</th>
          <th style="padding:12px 16px; font-weight:600; color:#475569;">Subject</th>
          <th style="padding:12px 16px; font-weight:600; color:#475569;">Score</th>
        </tr>
      </thead>
      <tbody>`;

    // Sort by newest first
    scores.reverse().forEach(s => {
      const d = new Date(s.date).toLocaleString();
      const pct = Math.round(s.score / s.total * 100);
      const color = pct >= 75 ? 'var(--primary)' : pct >= 50 ? '#f59e0b' : '#ef4444';
      
      tableHTML += `
        <tr style="border-bottom:1px solid #f1f5f9;">
          <td style="padding:12px 16px; font-size:0.85rem; color:#64748b;">${d}</td>
          <td style="padding:12px 16px; font-weight:600;">${s.name}</td>
          <td style="padding:12px 16px; color:#475569;">${s.subject}</td>
          <td style="padding:12px 16px; font-weight:700; color:${color};">${s.score} / ${s.total} (${pct}%)</td>
        </tr>`;
    });

    tableHTML += `</tbody></table>`;
    scoresBox.innerHTML = tableHTML;

  } catch(e) {
    scoresBox.innerHTML = `<div style="padding: 1rem; color: #ef4444; font-weight: 600; text-align: center;">Error: ${e.message}</div>`;
  }
});
</script>

</body>
</html>
