<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chemistry Cycle – Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<header class="site-header">
  <div class="header-inner">
    <div class="logo">Chemistry Admin Panel</div>
  </div>
</header>

<main class="container">

<!-- UPLOAD -->
<div class="admin-card">
  <h2>Upload File</h2>

  <form id="uploadForm">
    <label>Subject</label>
    <select id="subject">
      <option value="IPP">IPP</option>
      <option value="EEE">EEE</option>
      <option value="MAT">MAT</option>
      <option value="CHY">CHY</option>
      <option value="EV">EV</option>
      <option value="ESS">ESS</option>
      <option value="BIO">BIO</option>
      <option value="ADLD">ADLD</option>
    </select>

    <label>Title (Optional: defaults to filename)</label>
    <input id="title" placeholder="Unit 1 Notes">

    <label>File</label>
    <input id="file" type="file" required>

    <button type="submit" class="admin-btn">Upload to Cloudinary</button>
  </form>

  <div id="uploadStatus" class="status-msg" style="display:none;"></div>
</div>

</main>

<footer class="site-footer">
  <p>&copy; 2026 Chemistry Cycle Admin</p>
</footer>

<script type="module">
/* BASIC PROTECTION */
const ADMIN_PASSWORD = "1234";
if (prompt("Enter admin password") !== ADMIN_PASSWORD) {
  alert("Access denied");
  throw new Error("Blocked");
}

/* CLOUDINARY CONFIG (Saved locally so you don't type it every time) */
let cloudName = localStorage.getItem('CLOUDINARY_CLOUD_NAME');
let uploadPreset = localStorage.getItem('CLOUDINARY_UPLOAD_PRESET');

if (!cloudName || !uploadPreset) {
  cloudName = prompt("Enter Cloudinary Cloud Name");
  uploadPreset = prompt("Enter Cloudinary Unsigned Upload Preset Name");
  if (cloudName && uploadPreset) {
    localStorage.setItem('CLOUDINARY_CLOUD_NAME', cloudName);
    localStorage.setItem('CLOUDINARY_UPLOAD_PRESET', uploadPreset);
  } else {
    alert("Cloudinary credentials required for upload.");
    throw new Error("Missing Cloudinary Config");
  }
}

const uploadForm = document.getElementById('uploadForm');
const uploadStatus = document.getElementById('uploadStatus');

function setStatus(msg, type) {
  uploadStatus.style.display = 'block';
  uploadStatus.textContent = msg;
  uploadStatus.className = 'status-msg ' + type;
}

/* ===== UPLOAD ===== */
uploadForm.addEventListener('submit', async (e) => {
  e.preventDefault();

  const subject = document.getElementById('subject').value;
  let title = document.getElementById('title').value.trim();
  const file = document.getElementById('file').files[0];

  if (!subject || !file) {
    setStatus("Subject and File are required.", "error");
    return;
  }

  if (!title) {
    title = file.name.split('.').slice(0, -1).join('.'); 
  }

  const safeTitle = title.replace(/[^a-zA-Z0-9 _-]/g, '').replace(/ /g, '_');
  const folderPath = `chemistry_cycle/${subject}`;
  const tagContent = `chemistry_cycle_${subject}`;

  setStatus("Uploading to Cloudinary...", "");

  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', uploadPreset);
  formData.append('folder', folderPath);
  formData.append('public_id', safeTitle);
  formData.append('resource_type', 'auto'); 
  formData.append('tags', tagContent); // Critical for the Serverless Client List!

  try {
    const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/upload`, {
      method: 'POST',
      body: formData
    });

    const data = await res.json();

    if (!res.ok) {
      throw new Error(data.error?.message || "Upload Failed");
    }

    setStatus("Upload successful! Tag attached.", "success");
    uploadForm.reset();

  } catch(err) {
    setStatus(err.message, "error");
    console.error(err);
  }
});
</script>

</body>
</html>
