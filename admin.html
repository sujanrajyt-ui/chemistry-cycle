<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chemistry Cycle – Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body { margin:0; font-family:system-ui; background:#f8fafc; }
header { background:#dc2626; color:white; padding:1rem; }
main { max-width:900px; margin:2rem auto; padding:1rem; }
.card { background:white; padding:1.5rem; border-radius:12px; margin-bottom:2rem; }
input, select { width:100%; padding:0.5rem; margin-top:0.5rem; }
button { margin-top:1rem; padding:0.5rem 1rem; border:none; border-radius:8px; background:#dc2626; color:white; }
.status { margin-top:0.5rem; }
</style>
</head>

<body>

<header><strong>Chemistry Cycle Admin</strong></header>

<main>
<div class="card">
<h2>Upload PDF</h2>

<form id="uploadForm">
<select id="subject">
<option>IPP</option><option>EEE</option><option>MAT</option>
<option>CHY</option><option>EV</option><option>ESS</option>
<option>BIO</option><option>ADLD</option><option>BE</option>
</select>

<input id="title" placeholder="Title">
<input id="file" type="file" accept="application/pdf">

<button type="submit">Upload</button>
</form>

<div id="uploadStatus" class="status"></div>
</div>
</main>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient(
  'https://brvbbxbfcrcpgkxxfuhv.supabase.co',
  'YOUR_ANON_KEY'
);

const form = document.getElementById('uploadForm');
const status = document.getElementById('uploadStatus');

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const subject = document.getElementById('subject').value;
  const title = document.getElementById('title').value.trim();
  const file = document.getElementById('file').files[0];

  if (!subject || !title || !file) {
    status.textContent = "All fields required";
    return;
  }

  if (file.size > 5 * 1024 * 1024) {
    status.textContent = "Max 5MB file allowed";
    return;
  }

  const safeTitle = title.replace(/[^a-zA-Z0-9 _-]/g, '');
  const path = `chemistry_cycle/${subject}/${safeTitle}.pdf`;

  status.textContent = "Uploading...";

  const { error } = await supabase.storage
    .from('notes')
    .upload(path, file, {
      upsert: true,
      cacheControl: "3600"
    });

  if (error) {
    status.textContent = error.message;
    return;
  }

  status.textContent = "Uploaded!";
  form.reset();
});
</script>

</body>
</html>
