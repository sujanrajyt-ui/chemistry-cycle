<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chemistry Cycle – Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<style>
body {
  margin: 0;
  font-family: system-ui, sans-serif;
  background: #f8fafc;
}

header {
  background: linear-gradient(90deg, #b91c1c, #dc2626);
  color: white;
  padding: 1rem;
}

main {
  max-width: 900px;
  margin: 2rem auto;
  padding: 1rem;
}

.card {
  background: white;
  padding: 1.5rem;
  border-radius: 12px;
  margin-bottom: 2rem;
}

input, select {
  width: 100%;
  padding: 0.5rem;
  margin-top: 0.5rem;
}

button {
  margin-top: 1rem;
  padding: 0.5rem 1rem;
  border-radius: 8px;
  border: none;
  color: white;
  background: #dc2626;
  cursor: pointer;
}

.files {
  margin-top: 1rem;
}

.row {
  display: grid;
  grid-template-columns: 1fr auto auto;
  gap: 0.5rem;
  margin-top: 0.5rem;
}
</style>
</head>

<body>

<header>Chemistry Cycle – Admin</header>

<main>

<div class="card">
<h2>Upload PDF</h2>

<form id="uploadForm">
<select id="subject">
<option>IPP</option><option>EEE</option><option>MAT</option>
<option>CHY</option><option>EV</option><option>ESS</option>
<option>BIO</option><option>ADLD</option><option>BE</option>
</select>

<input id="title" placeholder="Title">
<input id="file" type="file">

<button type="submit">Upload</button>
</form>

<div id="status"></div>
</div>

<div class="card">
<h2>Manage Files</h2>

<select id="manageSubject">
<option>IPP</option><option>EEE</option><option>MAT</option>
<option>CHY</option><option>EV</option><option>ESS</option>
<option>BIO</option><option>ADLD</option><option>BE</option>
</select>

<button id="load">Load Files</button>

<div id="files" class="files"></div>
</div>

</main>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

/* BASIC PASSWORD */
const ADMIN_PASSWORD = "1234";
if (prompt("Enter password") !== ADMIN_PASSWORD) throw new Error("Blocked");

const supabase = createClient(
  'https://brvbbxbfcrcpgkxxfuhv.supabase.co',
  'YOUR_ANON_KEY'
);

const filesBox = document.getElementById('files');

/* UPLOAD */
uploadForm.addEventListener('submit', async (e) => {
  e.preventDefault();

  const subject = document.getElementById('subject').value;
  const title = document.getElementById('title').value;
  const file = document.getElementById('file').files[0];

  const path = `chemistry_cycle/${subject}/${title}.pdf`;

  const { error } = await supabase.storage
    .from('notes')
    .upload(path, file, { upsert: true });

  status.textContent = error ? error.message : "Uploaded successfully";
});

/* LOAD FILES */
async function loadFiles(subject) {
  const { data } = await supabase.storage
    .from('notes')
    .list(`chemistry_cycle/${subject}`);

  filesBox.innerHTML = "";

  data.forEach(file => {
    const row = document.createElement('div');
    row.className = "row";

    row.innerHTML = `
      <span>${file.name}</span>
      <button onclick="editFile('${subject}','${file.name}')">Edit</button>
      <button onclick="deleteFile('${subject}','${file.name}')">Delete</button>
    `;

    filesBox.appendChild(row);
  });
}

/* DELETE */
window.deleteFile = async (subject, name) => {
  await supabase.storage
    .from('notes')
    .remove([`chemistry_cycle/${subject}/${name}`]);

  loadFiles(subject);
};

/* EDIT */
window.editFile = async (subject, name) => {
  const newName = prompt("New name");
  if (!newName) return;

  await supabase.storage.from('notes').copy(
    `chemistry_cycle/${subject}/${name}`,
    `chemistry_cycle/${subject}/${newName}.pdf`
  );

  await supabase.storage.from('notes')
    .remove([`chemistry_cycle/${subject}/${name}`]);

  loadFiles(subject);
};

document.getElementById('load').onclick = () => {
  loadFiles(document.getElementById('manageSubject').value);
};
</script>

</body>
</html>
