<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chemistry Cycle – Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="style.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<header class="site-header">
  <div class="header-inner">
    <div class="logo">Chemistry Admin Panel</div>
  </div>
</header>

<main class="container">

<!-- MIGRATION STATION -->
<div class="admin-card" style="border: 2px solid #3b82f6;">
  <h2 style="color: #3b82f6;">Supabase to Cloudinary Migration</h2>
  <label>Click this button just once to automatically download all your old PDFs from Supabase and safely transfer them directly to your new Cloudinary account through your browser!</label>
  <button id="migrateBtn" class="admin-btn" style="background: linear-gradient(135deg, #3b82f6, #2563eb); margin-top: 1rem;">Start Automated Migration</button>
  <div id="migrateLog" class="status-msg" style="display:none; font-family: monospace; font-size: 0.85rem; text-align: left; max-height: 250px; overflow-y: auto; background: rgba(0,0,0,0.05); color: #1e293b; border: 1px solid #cbd5e1;"></div>
</div>

<!-- UPLOAD -->
<div class="admin-card">
  <h2>Upload New File</h2>

  <form id="uploadForm">
    <label>Subject</label>
    <select id="subject">
      <option value="IPP">IPP</option>
      <option value="EEE">EEE</option>
      <option value="MAT">MAT</option>
      <option value="CHY">CHY</option>
      <option value="EV">EV</option>
      <option value="ESS">ESS</option>
      <option value="BIO">BIO</option>
      <option value="ADLD">ADLD</option>
    </select>

    <label>Title (Optional: defaults to filename)</label>
    <input id="title" placeholder="Unit 1 Notes">

    <label>File</label>
    <input id="file" type="file" required>

    <button type="submit" class="admin-btn">Upload to Cloudinary</button>
  </form>

  <div id="uploadStatus" class="status-msg" style="display:none;"></div>
</div>

</main>

<footer class="site-footer">
  <p>&copy; 2026 Chemistry Cycle Admin</p>
</footer>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

/* BASIC PROTECTION */
const ADMIN_PASSWORD = "1234";
if (prompt("Enter admin password") !== ADMIN_PASSWORD) {
  alert("Access denied");
  throw new Error("Blocked");
}

/* CLOUDINARY CONFIG (Saved locally so you don't type it every time) */
let cloudName = localStorage.getItem('CLOUDINARY_CLOUD_NAME');
let uploadPreset = localStorage.getItem('CLOUDINARY_UPLOAD_PRESET');

if (!cloudName || !uploadPreset) {
  cloudName = prompt("Enter Cloudinary Cloud Name");
  uploadPreset = prompt("Enter Cloudinary Unsigned Upload Preset Name");
  if (cloudName && uploadPreset) {
    localStorage.setItem('CLOUDINARY_CLOUD_NAME', cloudName);
    localStorage.setItem('CLOUDINARY_UPLOAD_PRESET', uploadPreset);
  } else {
    alert("Cloudinary credentials required for upload.");
    throw new Error("Missing Cloudinary Config");
  }
}

/* ===== NEW BROWSER MIGRATION ===== */
const migrateBtn = document.getElementById('migrateBtn');
const migrateLog = document.getElementById('migrateLog');

function logMigrate(msg) {
  migrateLog.style.display = 'block';
  migrateLog.innerHTML += msg + "<br>";
  migrateLog.scrollTop = migrateLog.scrollHeight;
}

migrateBtn.addEventListener('click', async () => {
  if(!confirm("Ready to migrate? This might take a minute depending on how many files you have in Supabase.")) return;
  
  migrateBtn.disabled = true;
  migrateBtn.textContent = "Migration in progress...";
  logMigrate("<b>Establishing connection to Supabase...</b>");
  
  // Connect to the old database
  const supabase = createClient(
    'https://brvbbxbfcrcpgkxxfuhv.supabase.co',
    'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJydmJieGJmY3JjcGdreHhmdWh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ1NzM1MzIsImV4cCI6MjA4MDE0OTUzMn0.Z8FYzhVSn0eMgQAWcXg9ul70AeSyWMid4dFtrhAZalQ'
  );

  const subjects = ['IPP', 'EEE', 'MAT', 'CHY', 'EV', 'ESS', 'BIO', 'ADLD'];
  
  for (const subject of subjects) {
    logMigrate(`<strong style="color:#2563eb;">Checking Supabase Folder: ${subject}</strong>`);
    
    // 1. Fetch File List
    const { data: files } = await supabase.storage.from('notes').list(`chemistry_cycle/${subject}`);
    
    if (!files || files.length === 0) {
      logMigrate(`(No files found in ${subject})`);
      continue;
    }
    
    // 2. Loop & Download & Upload
    for (const file of files) {
      if (file.name === '.emptyFolderPlaceholder') continue;
      
      logMigrate(`Downloading <i>${file.name}</i> from Supabase...`);
      const { data: blob, error } = await supabase.storage.from('notes').download(`chemistry_cycle/${subject}/${file.name}`);
      
      if (error) { 
        logMigrate(`<span style="color:red;">Error downloading ${file.name}: ${error.message}</span>`); 
        continue; 
      }
      
      logMigrate(`Uploading <i>${file.name}</i> to Cloudinary...`);
      
      const safeTitle = file.name.split('.').slice(0, -1).join('.').replace(/[^a-zA-Z0-9 _-]/g, '').replace(/ /g, '_');
      const formData = new FormData();
      formData.append('file', blob, file.name);
      formData.append('upload_preset', uploadPreset);
      formData.append('folder', `chemistry_cycle/${subject}`);
      formData.append('public_id', safeTitle);
      formData.append('resource_type', 'auto');
      formData.append('tags', `chemistry_cycle_${subject}`); // CRITICAL FOR LIST API
      
      try {
        const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/upload`, {
          method: 'POST',
          body: formData
        });
        if (!res.ok) throw new Error("Cloudinary rejected upload");
        logMigrate(`<span style="color:green;">✅ Successfully copied: ${file.name}</span>`);
      } catch(e) {
        logMigrate(`<span style="color:red;">❌ Cloudinary upload failed for ${file.name}</span>`);
      }
    }
  }
  logMigrate("<br><b style='color:green;'>🎉 MIGRATION COMPLETELY FINISHED! 🎉</b>");
  migrateBtn.textContent = "Migration Completed!";
});

/* ===== REGULAR UPLOAD ===== */
const uploadForm = document.getElementById('uploadForm');
const uploadStatus = document.getElementById('uploadStatus');

function setStatus(msg, type) {
  uploadStatus.style.display = 'block';
  uploadStatus.textContent = msg;
  uploadStatus.className = 'status-msg ' + type;
}

uploadForm.addEventListener('submit', async (e) => {
  e.preventDefault();

  const subject = document.getElementById('subject').value;
  let title = document.getElementById('title').value.trim();
  const file = document.getElementById('file').files[0];

  if (!subject || !file) {
    setStatus("Subject and File are required.", "error");
    return;
  }

  if (!title) {
    title = file.name.split('.').slice(0, -1).join('.'); 
  }

  const safeTitle = title.replace(/[^a-zA-Z0-9 _-]/g, '').replace(/ /g, '_');
  const folderPath = `chemistry_cycle/${subject}`;
  const tagContent = `chemistry_cycle_${subject}`;

  setStatus("Uploading to Cloudinary...", "");

  const formData = new FormData();
  formData.append('file', file);
  formData.append('upload_preset', uploadPreset);
  formData.append('folder', folderPath);
  formData.append('public_id', safeTitle);
  formData.append('resource_type', 'auto'); 
  formData.append('tags', tagContent);

  try {
    const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/upload`, {
      method: 'POST',
      body: formData
    });

    const data = await res.json();

    if (!res.ok) throw new Error(data.error?.message || "Upload Failed");

    setStatus("Upload successful! Tag attached.", "success");
    uploadForm.reset();

  } catch(err) {
    setStatus(err.message, "error");
    console.error(err);
  }
});

</script>

</body>
</html>
