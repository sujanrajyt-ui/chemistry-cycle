<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chemistry Cycle - Notes</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

<header class="site-header">
  <div class="header-inner">
    <div class="logo">Chemistry Cycle</div>
  </div>
</header>

<main class="container">
<section class="hero">

<h1>Chemistry Cycle Notes</h1>
<p>Select a subject to view resources and materials.</p>

<div class="subjects">
  <button class="btn" data-subject="IPP">IPP</button>
  <button class="btn" data-subject="EEE">EEE</button>
  <button class="btn" data-subject="MAT">MAT</button>
  <button class="btn" data-subject="CHY">CHY</button>
  <button class="btn" data-subject="EV">EV</button>
  <button class="btn" data-subject="ESS">ESS</button>
  <button class="btn" data-subject="BIO">BIO</button>
  <button class="btn" data-subject="ADLD">ADLD</button>
</div>

<div id="filesBox" class="files-box" style="display:none;"></div>

</section>
</main>

<footer class="site-footer">
<p>&copy; 2026 Chemistry Cycle • By Sujanraj</p>
</footer>

<script type="module">
const filesBox = document.getElementById('filesBox');

// ================= NOTES =================
async function loadSubject(subject){
  filesBox.style.display = 'block';
  filesBox.innerHTML = `<div class="loader"></div>`;

  try {
    const res = await fetch(`/api/list?subject=${subject}`);
    if (!res.ok) throw new Error('Failed to load');
    const data = await res.json();

    if (!data || data.length === 0) {
      filesBox.innerHTML = `<h3>${subject} Notes</h3><p style="color: var(--text-secondary)">No files found in this subject.</p>`;
      return;
    }

    let html = `<h3>${subject} Notes</h3>`;
    for (const file of data) {
      html += `
        <div class="file-item">
          <a href="${file.url}" target="_blank">
            ${file.name.replace(/_/g, ' ')}
          </a>
        </div>
      `;
    }
    filesBox.innerHTML = html;

  } catch(err) {
    filesBox.innerHTML = `<p style="color: #f87171;">Error loading files. Please try again later.</p>`;
    console.error(err);
  }
}

// ================= QUIZ =================
async function loadQuizPage(file){
  filesBox.style.display = 'block';
  filesBox.innerHTML = `<div class="loader"></div>`;

  try {
    const res = await fetch(file);
    const html = await res.text();
    filesBox.innerHTML = html;

    // run scripts inside quiz
    filesBox.querySelectorAll("script").forEach(oldScript=>{
      const s = document.createElement("script");
      s.textContent = oldScript.textContent;
      document.body.appendChild(s);
    });
  } catch(err){
    filesBox.innerHTML = `<p style="color: #f87171;">Error loading quiz.</p>`;
    console.error(err);
  }
}

// ================= ROUTER =================
document.querySelectorAll('[data-subject]').forEach(btn=>{
  btn.onclick = ()=>{
    const s = btn.dataset.subject;

    if(s === "ESS") loadQuizPage("ess.html");
    else if(s === "BIO") loadQuizPage("bio.html");
    else loadSubject(s);
  };
});
</script>

</body>
</html>
