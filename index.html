<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chemistry Cycle - Notes</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css" />
</head>

<body>

<header class="site-header">
  <div class="header-inner">
    <div class="logo">Chemistry Cycle</div>
  </div>
</header>

<main class="container">
<section class="hero">

<h1>Chemistry Cycle Notes</h1>
<p>Select a subject to view notes or quiz.</p>

<div class="subjects">
  <button class="btn" data-subject="IPP">IPP</button>
  <button class="btn" data-subject="EEE">EEE</button>
  <button class="btn" data-subject="MAT">MAT</button>
  <button class="btn" data-subject="CHY">CHY</button>
  <button class="btn" data-subject="EV">EV</button>
  <button class="btn" data-subject="ESS">ESS</button>
  <button class="btn" data-subject="BIO">BIO</button>
</div>

<div id="filesBox" class="files-box" style="display:none;"></div>

</section>
</main>

<footer class="site-footer">
<p>&copy; 2025 Chemistry Cycle • By Sujanraj</p>
</footer>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient(
  'https://brvbbxbfcrcpgkxxfuhv.supabase.co',
  'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJydmJieGJmY3JjcGdreHhmdWh2Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjQ1NzM1MzIsImV4cCI6MjA4MDE0OTUzMn0.Z8FYzhVSn0eMgQAWcXg9ul70AeSyWMid4dFtrhAZalQ'
);

const filesBox = document.getElementById('filesBox');

/* NOTES */
async function loadSubject(subject){
  filesBox.style.display = 'block';
  filesBox.innerHTML = `Loading ${subject}...`;

  const { data } = await supabase.storage
    .from('notes')
    .list(`chemistry_cycle/${subject}`);

  if (!data || data.length === 0) {
    filesBox.innerHTML = "No files found";
    return;
  }

  filesBox.innerHTML = `<h3>${subject} Notes</h3>`;

  for (const file of data) {
    const { data:urlData } = await supabase
      .storage
      .from('notes')
      .createSignedUrl(`chemistry_cycle/${subject}/${file.name}`, 60);

    filesBox.innerHTML += `
      <div class="file-item">
        <a href="${urlData.signedUrl}" target="_blank">
          ${file.name}
        </a>
      </div>`;
  }
}

/* LOAD QUIZ HTML */
async function loadQuizPage(file){
  filesBox.style.display = 'block';
  filesBox.innerHTML = "Loading quiz...";

  const res = await fetch(file);
  const html = await res.text();

  filesBox.innerHTML = html;

  // execute scripts
  filesBox.querySelectorAll("script").forEach(oldScript=>{
    const s = document.createElement("script");
    s.textContent = oldScript.textContent;
    document.body.appendChild(s);
  });
}

/* ROUTER */
document.querySelectorAll('[data-subject]').forEach(btn=>{
  btn.onclick = ()=>{
    const s = btn.dataset.subject;

    if(s==="ESS") loadQuizPage("ess.html");
    else if(s==="BIO") loadQuizPage("bio.html");
    else loadSubject(s);
  };
});
</script>

</body>
</html>
