<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chemistry Cycle - Notes</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />

<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css" />
</head>

<body>

<header class="site-header">
  <div class="header-inner">
    <div class="logo">Chemistry Cycle</div>
  </div>
</header>

<main class="container">
<section class="hero">

<h1>Chemistry Cycle Notes</h1>
<p>Select a subject to view notes or quiz.</p>

<div class="subjects">
  <button class="btn" data-subject="IPP">IPP</button>
  <button class="btn" data-subject="EEE">EEE</button>
  <button class="btn" data-subject="MAT">MAT</button>
  <button class="btn" data-subject="CHY">CHY</button>
  <button class="btn" data-subject="EV">EV</button>
  <button class="btn" data-subject="ESS">ESS</button>
  <button class="btn" data-subject="BIO">BIO</button>
</div>

<div id="filesBox" class="files-box" style="display:none;"></div>

</section>
</main>

<footer class="site-footer">
<p>&copy; 2025 Chemistry Cycle • By Sujanraj</p>
</footer>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

const supabase = createClient(
  'https://brvbbxbfcrcpgkxxfuhv.supabase.co',
  'YOUR_KEY'
);

const filesBox = document.getElementById('filesBox');

/* LOAD NOTES */
async function loadSubject(subject) {
  filesBox.style.display = 'block';
  filesBox.innerHTML = `<p>Loading ${subject}...</p>`;

  const { data } = await supabase.storage
    .from('notes')
    .list(`chemistry_cycle/${subject}`);

  filesBox.innerHTML = `<h3>${subject} Notes</h3>`;

  data.forEach(file => {
    const div = document.createElement('div');
    div.className = 'file-item';
    div.innerHTML = `<a href="#">${file.name}</a>`;
    filesBox.appendChild(div);
  });
}

/* BUTTON LOGIC */
document.querySelectorAll('[data-subject]').forEach(btn => {
  btn.onclick = () => {
    const subject = btn.dataset.subject;

    if (subject === "ESS" || subject === "BIO") {
      loadQuiz(subject);
    } else {
      loadSubject(subject);
    }
  };
});
</script>

<script src="question-bank.js"></script>
<script src="quiz-engine.js"></script>

</body>
</html>
