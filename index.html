<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chemistry Cycle</title>
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- ✅ FIX favicon 404 -->
<link rel="icon" href="data:,">

<link rel="stylesheet" href="style.css">
</head>

<body>

<header class="site-header">
  <div class="header-inner">
    <div class="logo">Chemistry Cycle</div>
  </div>
</header>

<main class="container">
<section class="hero">

<h1>Chemistry Cycle Notes</h1>
<p>Select subject</p>

<div class="subjects">
<button class="btn" data-subject="IPP">IPP</button>
<button class="btn" data-subject="EEE">EEE</button>
<button class="btn" data-subject="MAT">MAT</button>
<button class="btn" data-subject="CHY">CHY</button>
<button class="btn" data-subject="EV">EV</button>
<button class="btn" data-subject="ESS">ESS</button>
<button class="btn" data-subject="BIO">BIO</button>
<button class="btn" data-subject="ADLD">ADLD</button>
<button class="btn" data-subject="BE">BE</button>
</div>

<button onclick="clearCache()" class="btn clear-btn">Clear Cache</button>

<div id="filesBox" class="files-box" style="display:none;"></div>

</section>
</main>

<footer class="site-footer">
<p>© 2025 Chemistry Cycle</p>
</footer>

<script type="module">
import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

/* ✅ SUPABASE INIT */
const supabase = createClient(
  'https://brvbbxbfcrcpgkxxfuhv.supabase.co',
  'YOUR_ANON_KEY'
);

const filesBox = document.getElementById('filesBox');

let cache = {};
let loading = false;

/* CLEAR CACHE */
window.clearCache = () => {
  cache = {};
  filesBox.innerHTML = "<p>Cache cleared</p>";
};

/* LOAD SUBJECT */
async function loadSubject(subject) {
  if (loading) return;
  loading = true;

  if (cache[subject]) {
    render(subject, cache[subject]);
    loading = false;
    return;
  }

  filesBox.style.display = 'block';
  filesBox.innerHTML = `<p>Loading ${subject}...</p>`;

  const { data, error } = await supabase.storage
    .from('notes')
    .list(subject);

  /* ✅ SAFE CHECK (prevents crash) */
  if (error || !data || data.length === 0) {
    filesBox.innerHTML = `<p>No files found for ${subject}</p>`;
    loading = false;
    return;
  }

  cache[subject] = data;
  render(subject, data);

  loading = false;
}

/* RENDER FILES */
async function render(subject, files) {
  filesBox.innerHTML = `<h3>${subject} Notes</h3>`;

  for (const file of files) {
    const path = `${subject}/${file.name}`;

    const { data, error } = await supabase.storage
      .from('notes')
      .createSignedUrl(path, 60);

    if (error || !data) continue;

    const div = document.createElement('div');
    div.className = "file-item";

    div.innerHTML = `
      <a href="${data.signedUrl}" target="_blank">
        ${file.name.replace('.pdf','')}
      </a>
    `;

    filesBox.appendChild(div);
  }
}

/* BUTTON EVENTS */
document.querySelectorAll('[data-subject]').forEach(btn => {
  btn.onclick = () => loadSubject(btn.dataset.subject);
});
</script>

</body>
</html>
