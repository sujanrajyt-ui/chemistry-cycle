<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chemistry Cycle - Notes</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<link rel="icon" href="data:,">
<link rel="stylesheet" href="style.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<header class="site-header">
  <div class="header-inner">
    <div class="logo">Chemistry Cycle</div>
  </div>
</header>

<main class="container">
<section class="hero">

<h1>Chemistry Cycle Notes</h1>
<p>Select a subject to view resources and materials.</p>

<div class="subjects">
  <button class="btn" data-subject="IPP">IPP</button>
  <button class="btn" data-subject="EEE">EEE</button>
  <button class="btn" data-subject="MAT">MAT</button>
  <button class="btn" data-subject="CHY">CHY</button>
  <button class="btn" data-subject="EV">EV</button>
  <button class="btn" data-subject="ESS">ESS</button>
  <button class="btn" data-subject="BIO">BIO</button>
  <button class="btn" data-subject="ADLD">ADLD</button>
</div>

<div id="bucketsContainer" class="buckets-container"></div>

</section>
</main>

<footer class="site-footer">
<p>&copy; 2026 Chemistry Cycle • By Sujanraj</p>
</footer>

<script type="module">
const bucketsContainer = document.getElementById('bucketsContainer');

function toggleBucket(subject) {
  const bucket = document.getElementById(`bucket-${subject}`);
  if (bucket) {
    bucket.style.display = bucket.style.display === 'none' ? 'block' : 'none';
    return true;
  }
  return false;
}

function createBucket(subject) {
  const bucket = document.createElement('div');
  bucket.id = `bucket-${subject}`;
  bucket.className = 'files-box bucket';
  bucket.innerHTML = `
    <div style="display:flex; justify-content:space-between; align-items:center; border-bottom: 2px solid rgba(239, 68, 68, 0.1); padding-bottom: 1rem; margin-bottom: 1.5rem;">
      <h3 style="margin:0; padding:0; border:none;">${subject} ${subject === 'ESS' || subject === 'BIO' ? 'Quiz' : 'Notes'}</h3>
      <button class="close-btn" onclick="document.getElementById('bucket-${subject}').style.display='none'">✖</button>
    </div>
    <div class="bucket-content"><div class="loader"></div></div>
  `;
  bucketsContainer.appendChild(bucket);
  return bucket.querySelector('.bucket-content');
}

// ================= NOTES =================
async function loadSubject(subject){
  if (toggleBucket(subject)) return;
  const contentArea = createBucket(subject);

  try {
    const res = await fetch(`/api/list?subject=${subject}`);
    
    if (!res.ok) throw new Error(`Backend Error ${res.status}`);
    const files = await res.json();

    if (!files || files.length === 0) {
      contentArea.innerHTML = `<p style="color: var(--text-secondary)">No files found in this subject.</p>`;
      return;
    }

    let html = '';
    for (const file of files) {
      html += `
        <div class="file-item">
          <a href="${file.url}" target="_blank">
            ${file.name.replace(/_/g, ' ')}
          </a>
        </div>
      `;
    }
    contentArea.innerHTML = html;

  } catch(err) {
    contentArea.innerHTML = `<p style="color: #ef4444; font-weight:600;">Error loading files:<br><small style="font-weight:400">${err.message}</small></p>`;
    console.error(err);
  }
}

// ================= QUIZ =================
async function loadQuizPage(file, subject){
  if (toggleBucket(subject)) return;
  const contentArea = createBucket(subject);

  try {
    const res = await fetch(file);
    const html = await res.text();
    contentArea.innerHTML = html;

    // Run custom quiz scripts
    contentArea.querySelectorAll("script").forEach(oldScript=>{
      const s = document.createElement("script");
      s.textContent = oldScript.textContent;
      document.body.appendChild(s);
    });
  } catch(err){
    contentArea.innerHTML = `<p style="color: #ef4444;">Error loading quiz.</p>`;
    console.error(err);
  }
}

// ================= ROUTER =================
document.querySelectorAll('[data-subject]').forEach(btn=>{
  btn.onclick = ()=>{
    const s = btn.dataset.subject;
    if(s === "ESS") loadQuizPage("ess.html", s);
    else if(s === "BIO") loadQuizPage("bio.html", s);
    else loadSubject(s);
  };
});
</script>

</body>
</html>
