);

const filesBox = document.getElementById('filesBox');

/* LOAD NOTES (UNCHANGED + FIXED) */
async function loadSubject(subject) {

  filesBox.style.display = 'block';
  filesBox.innerHTML = `<p>Loading ${subject} files...</p>`;

  const folder = `chemistry_cycle/${subject}`;

  const { data, error } = await supabase.storage
    .from('notes')
    .list(folder, { sortBy: { column: 'name', order: 'asc' } });

  if (error || !data || data.length === 0) {
    filesBox.innerHTML = `<p>No files found for ${subject}.</p>`;
    return;
  }

  filesBox.innerHTML = `<h3>${subject} Notes</h3>`;

  for (const file of data) {
    const path = `chemistry_cycle/${subject}/${file.name}`;

    const { data: urlData } = await supabase
      .storage
      .from('notes')
      .createSignedUrl(path, 60);

    const div = document.createElement('div');
    div.className = 'file-item';

    div.innerHTML = `
      <a href="${urlData.signedUrl}" target="_blank">
        ${file.name.replace('.pdf','')}
      </a>
    `;

    filesBox.appendChild(div);
  }
}

/* BUTTON LOGIC */
document.querySelectorAll('[data-subject]').forEach(btn => {
  btn.addEventListener('click', () => {
    const subject = btn.dataset.subject;

    if (subject === "ESS" || subject === "BIO") {
      loadQuiz(subject);
    } else {
      loadSubject(subject);
    }
  });
});
</script>
